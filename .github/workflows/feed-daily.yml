# Baja el detalle (GET gentil) de los IDs conocidos y regenera el feed. GitHub Pages sirve /docs.
name: feed-daily
on:
  schedule: [{ cron: "0 6 * * *" }]   # diario 06:00 UTC (03:00 AR)
  workflow_dispatch: {}
permissions: { contents: write }
concurrency: { group: feed, cancel-in-progress: false }
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node crawler.js build --seed data/seed-ids.json --out docs/feed.csv --refresh --rps 1 --concurrency 2
      - run: |
          git config user.name "deepbeacon-bot"; git config user.email "noreply@bureaucreativo.com"
          git add docs/feed.csv docs/products.json docs/excluded.csv 2>/dev/null || true
          git commit -m "feed: refresh $(date -u +%F)" || echo "sin cambios"; git pull --rebase --autostash || true; git push
